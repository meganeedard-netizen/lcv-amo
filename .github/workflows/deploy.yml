name: Build & Deploy — La Clef de Voûte

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm install

      - name: Génération du blog (Markdown → HTML) et du sitemap
        run: npm run build

      - name: Génération de la config SMTP (secrets GitHub)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os

          def esc(s):
              return s.replace('\\', '\\\\').replace("'", "\\'")

          user = esc(os.environ['SMTP_USER'])
          password = esc(os.environ['SMTP_PASSWORD'])

          content = (
              "<?php\n"
              "return [\n"
              "    'smtp_host' => 'smtp.hostinger.com',\n"
              "    'smtp_port' => 465,\n"
              f"    'smtp_user' => '{user}',\n"
              f"    'smtp_pass' => '{password}',\n"
              "];\n"
          )

          with open('mail-config.php', 'w') as f:
              f.write(content)
          PY

      - name: Génération du jeton de publication du blog (secret GitHub)
        env:
          CMS_GITHUB_TOKEN: ${{ secrets.CMS_GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os

          token = os.environ['CMS_GITHUB_TOKEN'].replace('\\', '\\\\').replace("'", "\\'")

          content = (
              "<?php\n"
              "return [\n"
              f"    'token' => '{token}',\n"
              "];\n"
          )

          with open('admin/cms-token.php', 'w') as f:
              f.write(content)
          PY

      - name: Déploiement FTP vers Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          state-name: .ftp-deploy-sync-state-2026-09-21b.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/oauth-worker/**
            **/scripts/**
            package.json
            package-lock.json
            README.md
            DEPLOIEMENT.md
